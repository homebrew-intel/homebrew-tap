paths:
  "**/.github/workflows/trigger-builder.yml":
    ignore:
      # actionlint's bundled metadata for create-github-app-token@v3 is stale:
      # the real action.yml has `client-id` (and deprecates `app-id`).
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
