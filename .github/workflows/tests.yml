name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - run: mise run test

  tap-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@2026.10.19.1
      - run: brew test-bot --only-tap-syntax

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the core commits the headers reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          commits="$(python3 scripts/tap/drift.py --list-commits)"
          read -r -a commit_list <<<"${commits//$'\n'/ }"
          scripts/ci/fetch-core.sh core ${commit_list[@]+"${commit_list[@]}"}
      - name: Check drift
        run: python3 scripts/tap/drift.py
        env:
          HOMEBREW_CORE_REPO: core

  pour-test:
    if: github.event_name == 'pull_request'
    needs: [tap-syntax, drift]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@2026.10.19.1
      - uses: jdx/mise-action@v5
        with:
          install_args: python
      - name: Pour changed bottled formulae in build order
        env:
          BASE_REF: ${{ github.base_ref }}
          # Nothing may download while a core keg is swapped out (see below).
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- Formula | sed 's@.*/@@; s@\.rb$@@')"
          scripts/audit/fetch-api.sh
          order="$(python3 scripts/tap/render.py --print-order)"
          brew trust homebrew-intel/tap
          found=no
          while IFS= read -r name <&3; do
            grep -qxF "$name" <<< "$changed" || continue
            grep -qs '^  bottle do' Formula/*/"${name}.rb" || continue
            found=yes
            # Download everything before any core keg is removed: the image's
            # brew downloads with its own curl, linked to openssl@3, so with
            # core's openssl@3 uninstalled every download fails. fetch and
            # deps, unlike install, accept a tap formula whose name is
            # installed from core.
            read -r -a deps <<< "$(brew deps --include-test "homebrew-intel/tap/${name}" | tr '\n' ' ')"
            # bash 3.2 under set -u calls an empty array unbound (cmake has
            # no dependencies), hence the ${deps[@]+...} form.
            brew fetch --force-bottle "homebrew-intel/tap/${name}" ${deps[@]+"${deps[@]}"}
            # The image ships some formulae from homebrew/core (cmake, for
            # one); brew refuses a same-named tap formula next to them.
            receipt="$(brew --prefix)/opt/${name}/INSTALL_RECEIPT.json"
            if [ -f "$receipt" ] && ! grep -qF '"tap":"homebrew-intel/tap"' <(tr -d ' \n' < "$receipt"); then
              brew uninstall --ignore-dependencies "$name"
            fi
            # brew test refuses to run without test dependencies, and neither
            # install nor reinstall adds them unasked. --overwrite: the image
            # links files of other kegs where ours link (bin/openssl belongs
            # to openssl@1.1), and this runner is thrown away afterwards.
            brew install --overwrite --only-dependencies --include-test "homebrew-intel/tap/${name}"
            if [ -d "$(brew --cellar)/${name}" ]; then
              brew reinstall --force-bottle "homebrew-intel/tap/${name}"
            else
              brew install --overwrite --force-bottle "homebrew-intel/tap/${name}"
            fi
            brew test "homebrew-intel/tap/${name}"
          done 3<<< "$order"
          if [ "$found" = no ]; then
            echo "no bottled formulae changed"
          fi

  trigger-builder:
    name: Trigger Builder
    runs-on: ubuntu-latest
    needs: [lint-and-test, tap-syntax, drift]
    # The builder's own bottle merges (squashed, authored by its App) only add
    # bottle blocks; dispatching them would force-rebuild the same formulae
    # and open another bottle pull request, endlessly.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && success() &&
      github.event.head_commit.author.name != 'homebrew-intel[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      
      - name: Detect changed formulae
        id: changed
        run: |
          set -Eeuo pipefail
          formulae=$(git diff HEAD^ HEAD --name-only -- Formula/ \
            | sed 's|Formula/.*/||; s|\.rb$||' \
            | tr '\n' ' ' \
            | sed 's/ $//')
          echo "formulae=$formulae"
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"
          if [ -z "$formulae" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Generate App token
        if: steps.changed.outputs.skip == 'false'
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.INTERNAL_APP_ID }}
          private-key: ${{ secrets.INTERNAL_APP_PRIVATE_KEY }}
          owner: homebrew-intel
          repositories: builder
      
      - name: Trigger builder workflow
        if: steps.changed.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          FORMULAE: ${{ steps.changed.outputs.formulae }}
        run: |
          gh workflow run build.yml \
            -R homebrew-intel/builder \
            -f formulae="$FORMULAE" \
            --ref main
          echo "✅ Builder triggered for: $FORMULAE"
